name: Controle qualite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualite:
    name: Verifications bloquantes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Controle qualite du site
        run: node scripts/verif-qualite.mjs
