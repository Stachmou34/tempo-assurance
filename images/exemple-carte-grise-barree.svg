<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="cgb-t cgb-d">
<rect width="560" height="320" fill="#F8FAFC"/>
<title id="cgb-t">Exemple de carte grise barrée</title>
<desc id="cgb-d">Certificat d'immatriculation traversé par un trait diagonal, portant la mention manuscrite « Vendu le 12/06/2026 à 14h30 » et la signature du titulaire. Le coupon détachable, à droite, est remis à l'acheteur avec le certificat de cession.</desc>

<rect x="14" y="26" width="360" height="236" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="14" y="26" width="360" height="34" rx="10" fill="#EFF4FF"/>
<rect x="14" y="50" width="360" height="10" fill="#EFF4FF"/>
<text x="30" y="48" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="1.2">CERTIFICAT D'IMMATRICULATION</text>

<g font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">
<text x="30" y="88">A</text><rect x="48" y="79" width="120" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="30" y="114">B</text><rect x="48" y="105" width="92" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="196" y="114">C.1</text><rect x="224" y="105" width="130" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="30" y="140">D.1</text><rect x="52" y="131" width="150" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="30" y="166">E</text><rect x="48" y="157" width="180" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="30" y="192">P.6</text><rect x="56" y="183" width="60" height="7" rx="3.5" fill="#E2E8F0"/>
<text x="196" y="192">J.1</text><rect x="222" y="183" width="80" height="7" rx="3.5" fill="#E2E8F0"/>
</g>

<line x1="34" y1="52" x2="356" y2="242" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>

<text x="56" y="158" transform="rotate(-9 56 158)" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#1D4ED8">Vendu le 12/06/2026 à 14h30</text>
<path d="M232 226 c 14 -20 24 6 36 -8 s 22 14 34 -4 c 6 -9 14 2 20 -6" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/>
<text x="232" y="248" font-family="system-ui,sans-serif" font-size="10.5" fill="#94A3B8">signature du titulaire</text>

<line x1="396" y1="26" x2="396" y2="262" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="404" y="26" width="142" height="236" rx="10" fill="#ffffff" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="418" y="50" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">COUPON</text>
<text x="418" y="65" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">DÉTACHABLE</text>
<g fill="#E2E8F0">
<rect x="418" y="86" width="112" height="7" rx="3.5"/><rect x="418" y="106" width="88" height="7" rx="3.5"/>
<rect x="418" y="126" width="104" height="7" rx="3.5"/><rect x="418" y="146" width="72" height="7" rx="3.5"/>
</g>
<text x="418" y="188" font-family="system-ui,sans-serif" font-size="10.5" fill="#64748B">à remettre</text>
<text x="418" y="203" font-family="system-ui,sans-serif" font-size="10.5" fill="#64748B">à l'acheteur</text>

<g font-family="system-ui,sans-serif" font-size="13" font-weight="700">
<circle cx="150" cy="118" r="13" fill="#0F172A"/><text x="150" y="123" fill="#fff" text-anchor="middle">1</text>
<circle cx="300" cy="140" r="13" fill="#0F172A"/><text x="300" y="145" fill="#fff" text-anchor="middle">2</text>
<circle cx="212" cy="226" r="13" fill="#0F172A"/><text x="212" y="231" fill="#fff" text-anchor="middle">3</text>
<circle cx="475" cy="232" r="13" fill="#0F172A"/><text x="475" y="237" fill="#fff" text-anchor="middle">4</text>
